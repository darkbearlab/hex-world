<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>六角世界實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eceeea; --surface:#f8f9f6; --fg:#1d2728; --muted:#5a6663; --line:#d0d6d2;
  --accent:#9a6a12; --accent-soft:#f1e6cf; --sea:#17303f; --good:#2f7a45; --warn:#a86a00; --bad:#b3261e;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1b; --surface:#1c2324; --fg:#e2e7e3; --muted:#93a19c; --line:#2d3839;
  --accent:#d8a443; --accent-soft:#3a2f1a; --sea:#0f222d; --good:#6cc287; --warn:#e3a33b; --bad:#f07065; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1b; --surface:#1c2324; --fg:#e2e7e3; --muted:#93a19c; --line:#2d3839;
  --accent:#d8a443; --accent-soft:#3a2f1a; --sea:#0f222d; --good:#6cc287; --warn:#e3a33b; --bad:#f07065; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:16px}
header h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.4rem,5vw,2rem);margin:0;letter-spacing:.04em}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem;max-width:70ch}
.main{display:grid;gap:16px}
@media (min-width:980px){.main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.col>*{min-width:0}
.mapbox{background:var(--sea);border-radius:6px;padding:8px;position:relative}
canvas{display:block;width:100%}
#map{cursor:crosshair;touch-action:manipulation}
.badge{position:absolute;left:14px;top:10px;font-family:var(--f-display);color:#f3ead6;font-size:1rem;text-shadow:0 1px 3px #000a;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 11px;font:inherit;font-size:.86rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seedin{font-family:var(--f-data);width:9.5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.panel h2{font-family:var(--f-display);font-size:1.02rem;margin:0 0 6px;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stat{border-left:3px solid var(--accent);padding-left:8px}
.stat b{display:block;font-family:var(--f-data);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;text-align:left;font-size:.78rem}
td.r,th.r{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--accent-soft)}
.ok{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.chron{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto;font-size:.88rem}
.chron li{display:grid;grid-template-columns:4em 1fr;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chron li:hover{background:var(--accent-soft)}
.chron .y{font-family:var(--f-data);color:var(--accent);font-size:.8rem;padding-top:2px}
.legend{font-size:.82rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.87rem;margin:6px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.busy{position:absolute;inset:8px;display:grid;place-items:center;background:#0009;color:#f3ead6;font-family:var(--f-display);border-radius:4px}
.busy[hidden]{display:none}
#chart{height:120px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>六角世界實驗室</h1>
    <p>封建化的試驗場：村莊把收成裝車送進市鎮，商隊在市鎮間買賣；戰爭有目標、會圍城，地方會自立，盜匪會火併、被招安或稱王。整個世界在你的瀏覽器裡跑，可以調速度、換種子。</p>
  </header>
  <div class="row">
    <input id="seed" class="seedin" value="灰燼-1031" aria-label="世界種子">
    <button class="btn primary" id="gen">推演 400 年</button>
    <button class="btn" id="rnd">換一個種子</button>
    <span class="seg" id="speed" role="group" aria-label="速度">
      <button data-v="0">暫停</button><button data-v="4" aria-pressed="true">1 日/秒</button><button data-v="28">1 季/秒</button><button data-v="112">1 年/秒</button><button data-v="-1">全速</button>
    </span>
  </div>
  <div class="main">
    <div class="col">
      <div class="mapbox"><canvas id="map"></canvas><div class="badge" id="clock"></div><div class="busy" id="busy">推演中…</div></div>
      <div class="row">
        <span class="seg" id="layers" role="group" aria-label="圖層">
          <button data-v="faction" aria-pressed="true">勢力</button><button data-v="market">市場範圍</button><button data-v="price">糧價</button><button data-v="bandit">盜匪</button>
        </span>
        <label class="legend"><input type="checkbox" id="showCarts" checked> 顯示車隊</label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="panel"><h2>市鎮數與人口</h2><canvas id="chart"></canvas><div class="legend">金線：市鎮數。灰線：總人口。虛線右邊是開服後。</div></div>
    </div>
    <div class="col">
      <div class="panel"><h2>運輸</h2><div class="stats" id="stats"></div></div>
      <div class="panel"><h2>勢力</h2><div class="tbl"><table><thead><tr><th>勢力</th><th class="r">建立</th><th class="r">領地</th><th class="r">人口</th><th class="r">收編兵</th></tr></thead><tbody id="facs"></tbody></table></div></div>
      <div class="panel"><h2>戰事</h2><ul class="chron" id="wars" style="max-height:220px"></ul></div>
      <div class="panel"><h2>盜匪山寨</h2><ul class="chron" id="gangs" style="max-height:200px"></ul><div class="legend">勢力＝山寨一帶的盜匪壓力。山寨離得近會火併；附近的勢力可能出糧出鐵招安；勢大的會自立為王。</div></div>
      <div class="panel" id="townPanel" hidden><h2 id="townName"></h2><div id="townBody"></div></div>
      <div class="panel"><h2>市鎮</h2><div class="tbl"><table><thead><tr><th>市鎮</th><th class="r">人口</th><th class="r">村</th><th class="r">糧</th><th class="r">鐵</th><th class="r">鹽</th><th class="r">糧滿足</th></tr></thead><tbody id="towns"></tbody></table></div>
        <div class="legend">價格單位是銀；綠色便宜、紅色昂貴。點一列可在地圖上看它的市場範圍。</div></div>
      <div class="panel"><h2>編年史</h2><ul class="chron" id="chron"></ul></div>
    </div>
  </div>
</div>
<script type="module">
/*SIM*/
const {generate,W,H,N,BIOMES,FDEF,NBR,GOODS,GN,BASEP,col,row}=SIM;
const $=id=>document.getElementById(id);
const GC={food:'#e7b84a',wood:'#74b85e',iron:'#9fc3e6',stone:'#c7a98a',salt:'#f3efe4'};
const TAG={war:'戰爭',ruin:'廢墟',hero:'英雄',bandit:'盜匪',disaster:'天災',found:'開拓',econ:'物資',trade:'貿易',build:'築城',npc:'旅人'};
let w=null,S=null,layer='faction',speed=4,sel=-1,R=10,centers=[],acc=0,last=0,series=[];
const cv=$('map'),ctx=cv.getContext('2d');

function layout(){const cssW=cv.parentElement.clientWidth-16;R=cssW/(Math.sqrt(3)*(W+.5));const cssH=R*(1.5*(H-1)+2);
  const dpr=window.devicePixelRatio||1;cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);cv.style.height=cssH+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  centers=[];for(let i=0;i<N;i++){const c=col(i),r=row(i);centers.push([Math.sqrt(3)*R*(c+.5*(r&1))+Math.sqrt(3)*R/2,R+1.5*R*r])}
  const ch=$('chart'),cw=ch.parentElement.clientWidth-28;ch.width=Math.round(cw*dpr);ch.height=Math.round(120*dpr);ch.style.width=cw+'px';ch.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}
function hexPath(x,y,r){ctx.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);const px=x+r*Math.cos(a),py=y+r*Math.sin(a);k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function hexRGB(h){if(h[0]!=='#')return h.match(/\d+/g).map(Number);const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hexRGB(a),B=hexRGB(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}
// 每座市鎮給一個色相，用在「市場範圍」圖層
const townHue=t=>`hsl(${(t*137.5)%360} 55% 55%)`;
function hsl2hex(s){const m=s.match(/[\d.]+/g).map(Number);const h=m[0],sa=m[1]/100,l=m[2]/100;const f=n=>{const k=(n+h/30)%12,a=sa*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return`rgb(${f(0)},${f(8)},${f(4)})`}

function draw(){if(!S)return;ctx.clearRect(0,0,cv.width,cv.height);const land=w.land,mk={};for(const m of S.markets)mk[m.t]=m;
  for(let i=0;i<N;i++){const [x,y]=centers[i],base=BIOMES[S.biome[i]].c;let fill=base;
    if(land[i]){const o=S.owner[i],dull=mix(base,'#8a8c86',.65);
      if(layer==='faction')fill=o>=0?mix(mix(base,'#888888',.5),S.econ[o].c,.35+Math.min(.5,S.pop[i]/160)):mix(base,'#7a7a72',.55);
      else if(layer==='market'){const t=S.mkt[i];fill=o>=0&&t>=0?mix(dull,hsl2hex(townHue(t)),sel<0||sel===t?.9:.2):mix(base,'#7a7a72',.6)}
      else if(layer==='price'){const m=mk[S.mkt[i]];fill=o>=0&&m?mix(mix(dull,'#2f7a45',Math.max(0,1-m.price.food)*1.6),'#b3261e',Math.min(1,Math.max(0,m.price.food-1)*.9)):mix(base,'#7a7a72',.6)}
      else if(layer==='bandit')fill=mix(dull,'#b3261e',Math.min(1,S.bandit[i]/100*1.4))}
    hexPath(x,y,R*1.01);ctx.fillStyle=fill;ctx.fill()}
  if(layer!=='bandit')for(let i=0;i<N;i++){const o=S.owner[i];if(o<0)continue;
    if(NBR[i].some(n=>S.owner[n]!==o)||NBR[i].length<6){hexPath(centers[i][0],centers[i][1],R*.82);ctx.strokeStyle=S.econ[o].c;ctx.lineWidth=Math.max(1,R*.12);ctx.stroke()}}
  ctx.strokeStyle='#6fb4e0';ctx.lineWidth=Math.max(1.2,R*.2);ctx.lineCap='round';ctx.lineJoin='round';
  for(const p of w.riverPaths){ctx.beginPath();p.forEach((t,k)=>{const[x,y]=centers[t];k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
  // 村莊到市鎮的連線（選了市鎮才畫，或在市場圖層）
  if(layer==='market'||sel>=0){ctx.lineWidth=1;for(let i=0;i<N;i++){const t=S.mkt[i];if(t<0||t===i||S.owner[i]<0||(sel>=0&&t!==sel))continue;
    ctx.beginPath();ctx.moveTo(...centers[i]);ctx.lineTo(...centers[t]);ctx.strokeStyle=sel>=0?'#fff9':'#0005';ctx.stroke()}}
  // 商路
  if(layer==='faction')for(const r of S.routes){const tot=GOODS.reduce((a,g)=>a+r.flow[g],0);if(tot<.3)continue;
    const g=GOODS.slice().sort((p,q)=>r.flow[q]-r.flow[p])[0],wd=Math.max(1.4,Math.min(R*.5,1+Math.sqrt(tot)*.6));
    ctx.beginPath();r.path.forEach((t,k)=>{const[x,y]=centers[t];k?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.strokeStyle='#000a';ctx.lineWidth=wd+2;ctx.stroke();ctx.strokeStyle=GC[g];ctx.lineWidth=wd;ctx.stroke()}
  for(let i=0;i<N;i++)if(S.ruin[i]){const[x,y]=centers[i];ctx.font=`700 ${R}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e8dfcf';ctx.fillText('✕',x,y)}
  // 車隊與商隊
  if($('showCarts').checked){const jit=k=>((k*9301+49297)%233280)/233280-.5;
    S.carts.forEach(([t],k)=>{const[x,y]=centers[t];ctx.fillStyle='#d9b26a';ctx.strokeStyle='#000a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x+jit(k)*R*.9,y+jit(k+7)*R*.9,Math.max(1.6,R*.13),0,7);ctx.fill();ctx.stroke()});
    S.caravans.forEach(([t,,,gi],k)=>{const[x,y]=centers[t],z=Math.max(3,R*.3),dx=jit(k+3)*R*.6,dy=jit(k+11)*R*.6;ctx.beginPath();ctx.moveTo(x+dx,y+dy-z);ctx.lineTo(x+dx+z,y+dy);ctx.lineTo(x+dx,y+dy+z);ctx.lineTo(x+dx-z,y+dy);ctx.closePath();
      ctx.fillStyle=GC[GOODS[gi]];ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke()})}
  // 市鎮
  const caps=new Set(S.econ.filter(e=>e.cap>=0).map(e=>e.cap));
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const m of S.markets){const[x,y]=centers[m.t],r=Math.max(3.5,R*(.28+Math.min(.3,m.pop/900)));
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=caps.has(m.t)?'#fff4d6':'#f3ead6';ctx.fill();ctx.lineWidth=Math.max(1.5,R*.16);ctx.strokeStyle=S.econ[m.f].c;ctx.stroke();
    if(caps.has(m.t)){ctx.font=`700 ${r*1.3}px system-ui`;ctx.fillStyle=S.econ[m.f].c;ctx.fillText('★',x,y+1)}
    if(R>9||m.t===sel){ctx.font=`700 ${Math.max(10,R*.85)}px ${getComputedStyle(document.body).fontFamily}`;ctx.lineWidth=3;ctx.strokeStyle='#000b';ctx.strokeText(w.names[m.t],x,y-r-R*.45);ctx.fillStyle='#fff';ctx.fillText(w.names[m.t],x,y-r-R*.45)}}
  // 戰爭目標（⚔）、圍城（紅圈）、盜匪山寨（☠，越大越強）
  for(const g of S.gangs){const[x,y]=centers[g.lair],z=Math.max(10,R*(.7+Math.min(.8,g.str/400)));ctx.font=`700 ${z}px system-ui`;ctx.lineWidth=3;ctx.strokeStyle='#000c';ctx.strokeText('☠',x,y);ctx.fillStyle='#f2e6d0';ctx.fillText('☠',x,y)}
  for(const w2 of S.wars){const[x,y]=centers[w2.goal];ctx.font=`700 ${Math.max(11,R*.95)}px system-ui`;ctx.lineWidth=3;ctx.strokeStyle='#000c';ctx.strokeText('⚔',x+R*.55,y-R*.45);ctx.fillStyle=S.econ[w2.att].c;ctx.fillText('⚔',x+R*.55,y-R*.45);
    if(w2.siege>=0){const[sx,sy]=centers[w2.siege];ctx.beginPath();ctx.arc(sx,sy,R*.85,0,7);ctx.setLineDash([3,3]);ctx.strokeStyle='#ff5a4a';ctx.lineWidth=2.2;ctx.stroke();ctx.setLineDash([])}}
  if(sel>=0){hexPath(centers[sel][0],centers[sel][1],R*1.02);ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.stroke()}
  const dark=[0,0,.08,.2][S.period];if(dark){ctx.fillStyle=`rgba(8,14,40,${dark})`;ctx.fillRect(0,0,cv.width,cv.height)}}

function drawChart(){const ch=$('chart'),c=ch.getContext('2d'),cw=ch.clientWidth||ch.width,hh=120;c.clearRect(0,0,cw,hh);if(series.length<2)return;
  const mt=Math.max(...series.map(s=>s.towns))*1.15,mp=Math.max(...series.map(s=>s.pop))*1.1,n=series.length,X=k=>4+k/(n-1)*(cw-8);
  const line=(f,m,col)=>{c.beginPath();series.forEach((s,k)=>{const y=hh-6-f(s)/m*(hh-14);k?c.lineTo(X(k),y):c.moveTo(X(k),y)});c.strokeStyle=col;c.lineWidth=1.6;c.stroke()};
  const st=getComputedStyle(document.documentElement);line(s=>s.pop,mp,st.getPropertyValue('--muted'));line(s=>s.towns,mt,st.getPropertyValue('--accent'));
  const k0=series.findIndex(s=>s.live);if(k0>0){c.setLineDash([3,3]);c.beginPath();c.moveTo(X(k0),0);c.lineTo(X(k0),hh);c.strokeStyle=st.getPropertyValue('--line');c.stroke();c.setLineDash([])}
  c.fillStyle=st.getPropertyValue('--accent');c.font='12px '+st.getPropertyValue('--f-data');c.fillText(`${series[n-1].towns} 鎮`,6,14);
  c.fillStyle=st.getPropertyValue('--muted');c.fillText(`${Math.round(series[n-1].pop)} 人`,70,14)}

const pcls=i=>i<=.8?'ok':i<1.6?'':i<2.4?'warn':'bad';
const price=(m,g)=>`<td class="r ${pcls(m.price[g])}">${(BASEP[g]*m.price[g]).toFixed(1)}</td>`;
function render(){if(!S)return;draw();
  $('clock').textContent=S.stamp;
  const st=S.stats,villages={};for(let i=0;i<N;i++)if(S.owner[i]>=0&&S.mkt[i]>=0&&S.mkt[i]!==i)villages[S.mkt[i]]=(villages[S.mkt[i]]||0)+1;
  const lr=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
  $('stats').innerHTML=[[S.markets.length,'市鎮'],[S.carts.length,'在路上的運糧車'],[S.caravans.length,'在路上的商隊'],[lr(st.cartLost,st.cart),'運糧車被劫率（累計）'],[lr(st.cvLost,st.cv),'商隊被劫率（累計）'],[S.year,'年']]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  const ms=S.markets.slice().sort((a,b)=>b.pop-a.pop);
  $('towns').innerHTML=ms.map(m=>`<tr data-t="${m.t}" class="${m.t===sel?'sel':''}"><td><span class="dot" style="background:${S.econ[m.f].c}"></span>${w.names[m.t]}</td><td class="r">${m.pop}</td><td class="r">${villages[m.t]||0}</td>${price(m,'food')}${price(m,'iron')}${price(m,'salt')}<td class="r ${m.ratio.food>=.95?'ok':m.ratio.food>=.7?'warn':'bad'}">${Math.round(m.ratio.food*100)}%</td></tr>`).join('');
  const m=S.markets.find(x=>x.t===sel);$('townPanel').hidden=!m;
  if(m){$('townName').textContent=`${w.names[m.t]}　${S.econ[m.f].n||''}`;
    const inbound=S.carts.filter(c=>c[1]===m.t).length,out=S.caravans.filter(c=>c[1]===m.t),inc=S.caravans.filter(c=>c[2]===m.t);
    $('townBody').innerHTML=`<dl class="kv"><dt>服務人口</dt><dd>${m.pop}（${villages[m.t]||0} 個村）</dd><dt>正在進城的運糧車</dt><dd>${inbound}</dd>
      <dt>派出的商隊</dt><dd>${out.map(c=>`${GN[GOODS[c[3]]]} ${c[4]} → ${w.names[c[2]]}`).join('、')||'無'}</dd><dt>來訪的商隊</dt><dd>${inc.map(c=>`${w.names[c[1]]} 的${GN[GOODS[c[3]]]}`).join('、')||'無'}</dd></dl>
      <div class="tbl"><table><thead><tr><th></th>${GOODS.map(g=>`<th class="r">${GN[g]}</th>`).join('')}</tr></thead><tbody>
      <tr><td>庫存</td>${GOODS.map(g=>`<td class="r">${m.stock[g].toFixed(1)}</td>`).join('')}</tr>
      <tr><td>價格</td>${GOODS.map(g=>price(m,g)).join('')}</tr>
      <tr><td>滿足率</td>${GOODS.map(g=>`<td class="r">${Math.round(m.ratio[g]*100)}%</td>`).join('')}</tr></tbody></table></div>`}
  $('facs').innerHTML=S.econ.map((e,k)=>[e,k]).filter(([e])=>e.alive).sort((a,b)=>b[0].tiles-a[0].tiles).map(([e])=>`<tr><td><span class="dot" style="background:${e.c}"></span>${e.n}</td><td class="r">${e.born>0?e.born+' 年':'開局'}</td><td class="r">${e.tiles}</td><td class="r">${Math.round(e.pop)}</td><td class="r">${e.merc||''}</td></tr>`).join('');
  $('wars').innerHTML=S.wars.map(x=>`<li data-t="${x.goal}"><span class="y">${x.start} 年</span><span><b style="color:${S.econ[x.att].c}">${S.econ[x.att].n}</b> → <b style="color:${S.econ[x.def].c}">${S.econ[x.def].n}</b>，目標 ${w.names[x.goal]}${x.siege>=0?`，正圍攻 ${w.names[x.siege]}`:''}（戰況 ${x.score>0?'+':''}${x.score}）</span></li>`).join('')||'<li><span></span><span>天下暫時太平。</span></li>';
  $('gangs').innerHTML=S.gangs.slice().sort((a,b)=>b.str-a.str).map(g=>`<li data-t="${g.lair}"><span class="y">${g.str}</span><span>${g.name}，盤據${w.names[g.lair]}</span></li>`).join('')||'<li><span></span><span>目前沒有成股的盜匪。</span></li>';
  $('chron').innerHTML=S.events.slice(-120).reverse().map(e=>`<li data-t="${e.tile??-1}"><span class="y">${e.y} 年</span><span>[${TAG[e.type]||e.type}] ${e.text}</span></li>`).join('');
  const LG={faction:'勢力：圓圈是市鎮（★ 首都），金色小點是運糧車，菱形是商隊（顏色＝貨物），彩色線是去年的商路。⚔ 是戰爭目標，紅色虛線圈是圍城，☠ 是盜匪山寨。',market:'市場範圍：同一個顏色的格子把收成送到同一座市鎮。點市鎮可單獨看它。',price:'糧價：每格看它所屬市鎮的糧價。綠便宜、紅昂貴。',bandit:'盜匪：越紅壓力越高，車隊走過越容易被劫。'};
  $('legend').textContent=LG[layer];drawChart()}

function sample(){const v=w.sim.view();series.push({towns:v.markets.length,pop:v.pop.reduce((a,b)=>a+b,0),live:true})}
function step(n){let ended=false;for(let k=0;k<n;k++)if(w.sim.periodTick()){ended=true;sample()}S=w.sim.view();return ended}
function loop(t){const dt=Math.min(.25,(t-last)/1000);last=t;
  if(w&&speed!==0){if(speed<0){const t0=performance.now();let n=0;while(performance.now()-t0<30){w.sim.periodTick()&&sample();n++}S=w.sim.view();render()}
    else{acc+=dt*speed;const n=Math.floor(acc);if(n>0){acc-=n;step(n);render()}}}
  requestAnimationFrame(loop)}

function boot(){const seed=$('seed').value.trim()||'灰燼-1031';$('busy').hidden=false;$('busy').textContent='推演 400 年歷史中…';
  setTimeout(()=>{w=generate(seed);w.sim.startLive(0);
    series=w.snaps.map(s=>({towns:s.town.reduce((a,b)=>a+b,0),pop:s.pop.reduce((a,b)=>a+b,0),live:false}));
    S=w.sim.view();sel=-1;layout();render();$('busy').hidden=true},30)}

$('gen').onclick=boot;
$('rnd').onclick=()=>{const A=['灰燼','霜歌','鐵冠','白河','長夜','赤沙','青嶺','雪港'];$('seed').value=A[Math.floor(Math.random()*A.length)]+'-'+Math.floor(Math.random()*9999);boot()};
const segs=(id,fn)=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const x of $(id).children)x.setAttribute('aria-pressed',x===b);fn(b.dataset.v)});
segs('speed',v=>{speed=+v;acc=0});segs('layers',v=>{layer=v;render()});
$('showCarts').onchange=render;
$('towns').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr)return;const t=+tr.dataset.t;sel=sel===t?-1:t;render()});
for(const id of ['chron','wars','gangs'])$(id).addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;const t=+li.dataset.t;if(t>=0){sel=S.town[t]?t:S.mkt[t]>=0?S.mkt[t]:t;render()}});
cv.addEventListener('click',e=>{if(!S)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=-1,bd=1e9;
  centers.forEach(([cx,cy],i)=>{const d=(cx-x)**2+(cy-y)**2;if(d<bd){bd=d;b=i}});const t=S.town[b]?b:S.mkt[b];sel=t>=0&&t!==sel?t:-1;render()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();render()},120)});
boot();requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
</html>
