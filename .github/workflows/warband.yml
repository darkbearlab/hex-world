# warband/ 有變動推送到 main 時，部署奇幻戰幫切片（獨立的 Worker：warband，只有靜態檔案）
name: 部署戰幫切片

on:
  push:
    branches: [main]
    paths: ['warband/**', '.github/workflows/warband.yml']
  workflow_dispatch: {}

concurrency:
  group: warband
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安裝套件
        run: npm ci
      - name: 規則測試（決定性與平衡）
        run: node warband/test/battle-sim.mjs && node warband/test/world-sim.mjs 8 30
      - name: 部署
        run: npx wrangler deploy --config warband/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
