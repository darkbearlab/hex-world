# 奇美拉：靜態網頁（單人測試模式的推演在瀏覽器的 worker 裡跑，網址加 ?local）＋共用星球的伺服器（/api/*，一個 Durable Object 持有整顆星球）
name = "chimera"
main = "server/worker.js"
compatibility_date = "2025-09-01"
account_id = "beb6f869ff9d765dbf31116243c5b348"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 共用星球：一個 Durable Object，存檔在它內建的 SQLite 儲存空間
[[durable_objects.bindings]]
name = "PLANET"
class_name = "Planet"

# 每張任務票一場戰鬥（S2）：規則與隊員機器人在伺服器上跑
[[durable_objects.bindings]]
name = "SKIRMISH"
class_name = "Skirmish"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Planet"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Skirmish"]

[limits]
cpu_ms = 30000

# 伺服器上的戰鬥（server/battle.js）會載入 ASH 的模組；其中幾個在載入時用 import.meta.url 組圖片網址（伺服器不畫圖），
# 打包後的 Worker 沒有自己的網址，給一個固定的就好
[define]
"import.meta.url" = '"https://chimera.invalid/ash/src/server.js"'

[vars]
# 改這個數字並推送，星球就從頭重新產生（所有公司一起重來）
WORLD_VERSION = "3"
# 星球放在哪一洲的機房（Durable Object 第一次建立時決定，之後不會搬；要搬就得改 WORLD_VERSION 重新產生）。
# 2026-10-09 從美國（沒給提示，建在亞特蘭大）搬到亞洲
PLANET_HINT = "apac"
# 戰鬥的方式：verify＝瀏覽器跑、伺服器重播驗證（預設，DESIGN.md 方案 A）；authority＝伺服器跑、瀏覽器只播動畫（方案 C 留著用）
BATTLE_MODE = "verify"
# 星球的種子
WORLD_SEED = "奇美拉-1"
# 一個遊戲小時是現實的幾毫秒。3600000 = 一比一（Alan 2026-10-08）；測試時可以調小
HOUR_MS = "3600000"
# 用 Google 登入（和 warband 同一個 OAuth 用戶端；要在 Google Cloud 把 https://chimera.darkbearlab.workers.dev 加進「已授權的 JavaScript 來源」）
GOOGLE_CLIENT_ID = "761557729646-spe24525vg4fcju3ihqjtm5v6l15leni.apps.googleusercontent.com"
# 設成 "1" 星球就暫停（時鐘停下、進度保留）
PAUSED = "0"
