# 奇美拉：靜態網頁（單人測試模式的推演在瀏覽器的 worker 裡跑，網址加 ?local）＋共用星球的伺服器（/api/*，一個 Durable Object 持有整顆星球）
name = "chimera"
main = "server/worker.js"
compatibility_date = "2025-09-01"
account_id = "beb6f869ff9d765dbf31116243c5b348"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 共用星球：一個 Durable Object，存檔在它內建的 SQLite 儲存空間
[[durable_objects.bindings]]
name = "PLANET"
class_name = "Planet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Planet"]

[limits]
cpu_ms = 30000

[vars]
# 改這個數字並推送，星球就從頭重新產生（所有公司一起重來）
WORLD_VERSION = "1"
# 星球的種子
WORLD_SEED = "奇美拉-1"
# 一個遊戲小時是現實的幾毫秒。3600000 = 一比一（Alan 2026-10-08）；測試時可以調小
HOUR_MS = "3600000"
# 設成 "1" 星球就暫停（時鐘停下、進度保留）
PAUSED = "0"
