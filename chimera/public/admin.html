<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chimera 後台</title>
<style>
:root{--bg:#14120f;--panel:#1d1a16;--line:#3a332a;--text:#e8dfcf;--muted:#9a8f7c;--accent:#e0a64a;--war:#e5654b;--good:#7fc06a;--blue:#6fa8dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 'Noto Sans TC',system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:#0f0d0b;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
header h1{font-size:17px;margin:0;color:var(--accent)}
header .meta{color:var(--muted);font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
nav a:hover{color:var(--text)}
main{padding:12px 16px 60px;max-width:1400px;margin:0 auto}
section{margin:18px 0}
h2{font-size:15px;margin:0 0 8px;color:var(--accent);display:flex;gap:10px;align-items:baseline}
h2 small{color:var(--muted);font-weight:400;font-size:12px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid #2a2520;text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-weight:400;position:sticky;top:0;background:var(--panel)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrapc{white-space:normal;min-width:260px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag.npc{color:var(--blue);border-color:#2e4a63}.tag.war{color:var(--war);border-color:#5a2b22}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card b{color:var(--text)}.muted{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:#2a2520;overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%}
svg text{fill:var(--muted);font-size:10px}
input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;font:inherit;width:min(360px,100%)}
#err{color:var(--war);padding:20px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
</style>
</head>
<body>
<header><h1>Chimera 後台</h1><span class="meta" id="now">讀取中…</span>
<nav><a href="#camp">大戰役</a><a href="#fac">勢力</a><a href="#war">戰爭</a><a href="#co">公司</a><a href="#cases">案件</a><a href="#tk">服務單</a><a href="#board">委託板</a><a href="#gang">幫派</a><a href="#wp">遺產級</a><a href="#ev">紀錄</a><a href="/">回遊戲</a></nav></header>
<main><div id="err" hidden></div><div id="out"></div></main>
<script type="module" src="./admin.js"></script>
</body>
</html>
