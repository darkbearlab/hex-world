<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PVP 對戰</title>
<style>
:root{--bg:#0d1010;--bar:#161a1f;--line:#2c313a;--ink:#e6e8ec;--dim:#8b93a1;--ok:#7fd48b;--warn:#f0c062;--foe:#ff6b5f}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Noto Sans TC",sans-serif}
#pvpbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
#pvpbar .pill{padding:2px 8px;border-radius:99px;background:var(--line);color:var(--dim);font-size:13px}
#pvpbar .pill.me{background:#244a2c;color:var(--ok)}#pvpbar .pill.warn{background:#4a3a1c;color:var(--warn)}
#pvpbar button{background:#2a3040;color:var(--ink);border:1px solid #3a4256;border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
#pvpbar button.primary{background:#2f5d3a;border-color:#3f7a4c}#pvpbar button.danger{background:#5a2a2a;border-color:#7a3a3a}
#pvpbar button:disabled{opacity:.4}
#ash-root{position:fixed;left:0;right:0;bottom:0;top:var(--bar-h,40px)}
#cover{position:fixed;left:0;right:0;bottom:0;top:var(--bar-h,40px);z-index:900;display:grid;place-items:center;background:#0d1010cc;font-size:16px;text-align:center;padding:16px}
#cover[hidden]{display:none}
#since{max-width:520px;color:var(--dim);font-size:13px;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="pvpbar"><b>PVP</b><span id="bSide" class="pill"></span><span id="bRound" class="pill"></span><span id="bPhase" class="pill"></span><span id="bLeft" class="pill"></span><span id="bTimer" class="pill"></span>
 <span style="flex:1"></span><button id="bCenter" title="鏡頭移到操作中的人（畫面可以拖曳）">置中</button><button id="bEnd" class="primary" disabled>結束階段</button><button id="bSurr" class="danger">投降</button></div>
<div id="cover"><div><div id="coverText">載入 ASH 戰鬥畫面⋯</div><div id="since"></div></div></div>
<script type="module">
// 座位跟 index.html 共用（localStorage 的 pvp-token、pvp-side）；沒坐下或對戰沒開始就回 index.html
const store={get(k){try{return localStorage.getItem(k)}catch{return null}}};
const token=store.get('pvp-token')||'',side=(store.get('pvp-side')||'').toUpperCase();
if(!token||!side)location.replace('./');
const $=id=>document.getElementById(id);
const bar=$('pvpbar');new ResizeObserver(()=>document.documentElement.style.setProperty('--bar-h',bar.offsetHeight+'px')).observe(bar);
const api=async(p,opt={})=>{const r=await fetch(`/api/${p}${p.includes('?')?'&':'?'}side=${side}`,{...opt,headers:{'x-seat':token,...(opt.headers||{})}});return r.json();};
let info=null,phase=null,deadline=null;
const {bootAsh}=await import('./ash/pvp-boot.js');
const E=await bootAsh();E.connect({side,token});
$('bSide').textContent=`你是 ${side} 隊`;
function hud(v){
 if(!v)return;phase=v.phase;
 $('bRound').textContent=v.round?`第 ${v.round}/300 回合`:'';
 const mine=v.phase==='play';$('bPhase').textContent=mine?'你的階段':v.phase==='wait'?'對方的階段':v.phase==='over'?'對戰結束':'';$('bPhase').className='pill'+(mine?' me':'');
 $('bLeft').textContent=mine?`還沒動：${(v.left||[]).join(' ')||'（都動過了）'}`:'';
 $('bEnd').disabled=!mine;
 const k=v.kills||{},o=side==='A'?'B':'A';$('bRound').title=`拿下 ${k[side]||0}／倒下 ${k[o]||0}`;
}
setInterval(()=>{$('bTimer').textContent=deadline&&phase==='play'?`剩 ${Math.max(0,Math.ceil((deadline-Date.now())/1000))} 秒`:'';$('bTimer').className='pill'+(deadline&&deadline-Date.now()<15000?' warn':'');},500);
E.onView=d=>{hud(d);if(d.phase!=='play'||(d.replayN||0)>cursor)wait();};   // 對方的動作還沒播（對機器人時它的整個階段在你結束的那一下就算完了）
// 報到：伺服器 2 分鐘沒收到這個座位的任何請求就判斷線投降；自己的階段裡想很久也不會被誤判
setInterval(()=>{if(phase==='play')api('json').then(j=>{deadline=j.deadline;}).catch(()=>{});},20000);
let waiting=false;
// 不是你的階段：畫面照開著，對方的動作在你的人看得到的範圍內照樣播（Alan 2026-10-15）；輪到你再換成新的局面
const revive=(k,v)=>v&&typeof v==='object'?(Array.isArray(v.$set)?new Set(v.$set):Array.isArray(v.$map)?new Map(v.$map):v):v;
let cursor=0,shown=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function replay(){const r=await fetch(`/api/replay?side=${side}`,{method:'POST',body:String(cursor),headers:{'x-seat':token}});return JSON.parse(await r.text(),revive);}
async function wait(){
 if(waiting)return;waiting=true;
 try{
  if(!shown){const v=await api('view');if(v.state){E.startRemote(v);shown=true;$('cover').hidden=true;}}
  $('bPhase').textContent='對方行動中⋯';$('bPhase').className='pill';$('bLeft').textContent='';$('bEnd').disabled=true;
  for(;;){
   const rp=await replay(),back=E.camera?.position&&{...E.camera.position};
   for(const f of rp.frames){
    cursor=f.n;
    // 演出：鏡頭先轉到看得到的那個敵人（只有這段，播完回到你原本的位置）
    const actor=f.unit&&(f.after.enemies||[]).find(e=>e.id===`px-${f.unit}`)||f.unit&&(f.before.enemies||[]).find(e=>e.id===`px-${f.unit}`);
    if(actor)E.camera?.center(actor);
    E.applyState(f.after);   // 播完停在這一格之後的樣子
    E.present([{before:E.hydrate(f.before),after:E.hydrate(f.after),effects:f.effects}]);
    await sleep(60);while(E.busy())await sleep(60);await sleep(250);
   }
   if(rp.frames.length&&back)E.camera?.center(back);
   if(rp.phase==='pick'||rp.phase==='none'){location.replace('./');return;}
   if(rp.phase==='play'||rp.phase==='over')break;
   if(!rp.frames.length){const j=await api('jwait?t=20');deadline=j.deadline;$('bRound').textContent=j.round?`第 ${j.round}/300 回合`:'';if(j.phase==='pick'){location.replace('./');return;}}
  }
  const v=await api('view');
  if(v.phase==='over'){over(v);return;}
  hud(v);E.startRemote(v);shown=true;$('cover').hidden=true;
  $('since').textContent='';if(v.since?.length)note('對方階段：'+v.since.join('；'));
 }finally{waiting=false;}
}
// 對戰結束：結果＋「儲存這場的戰鬥過程」（Alan 2026-10-16：打完可以選擇存在線上，之後在觀戰頁重播）
function over(v){
 $('cover').hidden=false;
 $('coverText').innerHTML=`對戰結束：${v.winner===side?'你贏了':v.winner?'你輸了':'平手'}<br><br><button id="bSave" style="font:inherit;padding:8px 14px;border-radius:6px;background:#2f5d3a;color:#e6e8ec;border:1px solid #3f7a4c;cursor:pointer">儲存這場的戰鬥過程</button> <a href="./" style="color:#8fc7ff;margin-left:12px">回到大廳</a><div id="saveMsg" style="font-size:13px;margin-top:10px;color:#8b93a1"></div>`;
 $('since').textContent=(v.log||[]).join('\n');
 $('bSave').onclick=async()=>{$('bSave').disabled=true;const r=await fetch('/api/save?side='+side,{method:'POST',headers:{'x-seat':token}});const o=await r.json();
  if(o.ok){const u=new URL(`watch.html?replay=${o.id}`,location.href).href;$('saveMsg').innerHTML=`存好了：<a href="${u}" style="color:#8fc7ff">${u}</a>（大廳的「儲存的戰鬥」也看得到）`;}else{$('saveMsg').textContent=o.msg||'存不了';$('bSave').disabled=false;}};
}
// 對方階段的傷害提示（ASH 的紀錄面板之外，短暫顯示在上方）
function note(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:calc(var(--bar-h,40px) + 8px);left:50%;transform:translateX(-50%);z-index:1001;background:#3a1c1ccc;color:#ffd0c8;padding:6px 12px;border-radius:6px;max-width:90vw;font-size:13px';document.body.append(d);setTimeout(()=>d.remove(),8000);}
$('bCenter').onclick=()=>E.camera?.center(E.game?.player);
$('bEnd').onclick=async()=>{$('bEnd').disabled=true;const d=await E.op('end');hud(d);wait();};
$('bSurr').onclick=async()=>{if(!confirm('確定投降？'))return;const d=await E.op('surrender');hud(d);wait();};
// 開始：拿現在的畫面（對方的階段就等）
const v=await api('view');
if(v.phase==='none'){location.replace('./');}
else if(v.phase==='play'){const j=await api('json');deadline=j.deadline;hud(v);E.startRemote(v);shown=true;$('cover').hidden=true;if((v.replayN||0)>cursor)wait();}
else wait();
</script>
</body>
</html>
