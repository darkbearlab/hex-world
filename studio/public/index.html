<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1f24">
<title>像素工作室</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登入 -->
<section id="login" class="screen" hidden>
  <form id="loginForm" class="card narrow">
    <h1>像素工作室</h1>
    <p class="muted">輸入你設定的密語</p>
    <input id="loginKey" type="password" autocomplete="current-password" placeholder="密語" required>
    <button type="submit" class="primary">進入</button>
    <p id="loginMsg" class="err" role="alert"></p>
    <button type="button" id="offlineBtn" class="link" hidden>先離線使用這台裝置上的作品</button>
  </form>
</section>

<!-- 作品列表 -->
<section id="home" class="screen" hidden>
  <header class="bar">
    <h1>像素工作室</h1>
    <span id="net" class="pill"></span>
    <span class="grow"></span>
    <button id="trashBtn" class="ghost">垃圾桶</button>
    <a id="exportAll" class="ghost btn" href="/api/export" download>匯出全部備份</a>
    <button id="logoutBtn" class="ghost">登出</button>
  </header>
  <div class="newrow">
    <span class="muted">新作品：</span>
    <select id="newPlat" aria-label="新作品的模式"><option value="free">自由</option><option value="gba16">GBA 16 色</option></select>
    <button data-size="16">16×16</button>
    <button data-size="32">32×32</button>
    <button data-size="64">64×64</button>
    <button data-size="128">128×128</button>
    <button data-size="256">256×256</button>
    <span class="custom"><input id="cw" type="number" min="1" max="512" value="48" aria-label="寬">×<input id="ch" type="number" min="1" max="512" value="48" aria-label="高"><button id="customNew">自訂</button></span>
    <button id="importNew" class="primary">從圖片轉像素…</button>
  </div>
  <h2 id="listTitle">我的作品</h2>
  <div id="docs" class="grid"></div>
  <p id="empty" class="muted" hidden>還沒有作品。從上面挑個尺寸開始吧。</p>
</section>

<!-- 編輯器 -->
<section id="editor" class="screen" hidden>
  <header class="bar">
    <button id="backBtn" class="ghost" title="回作品列表">‹ 作品</button>
    <input id="docName" class="name" aria-label="作品名稱">
    <span id="saveState" class="pill"></span>
    <span class="grow"></span>
    <button id="undoBtn" class="ghost" title="復原 (Ctrl+Z)">↶</button>
    <button id="redoBtn" class="ghost" title="重做 (Ctrl+Shift+Z)">↷</button>
    <select id="platform" title="作業模式" aria-label="作業模式"><option value="free">自由</option><option value="gba16">GBA 16 色</option></select>
    <span id="colorCount" class="pill click" title="點開看用到哪些顏色">色數</span>
    <button id="mirrorBtn" class="ghost" title="鏡像編輯 (M)：關 → 左右 → 上下 → 四向">鏡像：關</button>
    <label class="size" title="等分參考線">參考線<select id="guides"><option value="0">關</option><option value="d2">2 等分</option><option value="d3">3 等分</option><option value="d4">4 等分</option><option value="d8">8 等分</option><option value="s8">每 8 格</option><option value="s16">每 16 格</option></select></label>
    <button id="gridBtn" class="ghost" title="格線 (#)" aria-pressed="true">格線</button>
    <button id="fitBtn" class="ghost" title="置中 (0)">置中</button>
    <button id="histBtn" class="ghost">版本</button>
    <button id="importBtn" class="ghost">匯入圖片</button>
    <button id="pngBtn" class="ghost">匯出 PNG</button>
    <button id="layersToggle" class="ghost only-narrow">圖層</button>
  </header>
  <div class="work">
    <div id="stage"><canvas id="view"></canvas></div>
    <aside id="side">
      <h3>圖層</h3>
      <div id="layers"></div>
      <div class="row">
        <button id="addLayer" title="新增圖層">＋</button>
        <button id="dupLayer" title="複製圖層">複製</button>
        <button id="upLayer" title="上移">↑</button>
        <button id="downLayer" title="下移">↓</button>
        <button id="mergeLayer" title="向下合併">合併</button>
        <button id="delLayer" title="刪除圖層">刪除</button>
      </div>
      <label class="row">不透明度 <input id="opacity" type="range" min="0" max="100" value="100"></label>
    </aside>
  </div>
  <footer class="tools">
    <div class="toolset">
      <button data-tool="pencil" title="鉛筆 (B)">✏️</button>
      <button data-tool="eraser" title="橡皮擦 (E)">⌫</button>
      <button data-tool="fill" title="填色 (G)">🪣</button>
      <button data-tool="picker" title="滴管 (I)">💧</button>
      <button data-tool="lighten" title="加亮筆刷 (L)：變亮、偏暖">☀</button>
      <button data-tool="darken" title="壓暗筆刷 (D)：變暗、偏冷">☾</button>
      <button data-tool="pan" title="移動畫面 (空白鍵拖曳)">✋</button>
      <label class="size" title="筆刷大小 ([ ])">筆刷<select id="brush"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select></label>
    </div>
    <div class="colors">
      <span id="cur" class="swatch big" title="目前顏色"></span>
      <div id="palette"></div>
      <label class="addc" title="加入新顏色">＋<input id="picker" type="color" value="#ff8800"></label>
      <button id="lockPal" class="lock" hidden title="鎖定後不會再加新顏色，明暗筆刷只在色票裡找顏色">🔓 色票未鎖</button>
      <button id="rmColor" title="從調色盤移除目前顏色">−</button>
    </div>
  </footer>
</section>

<!-- 版本 -->
<dialog id="histDlg">
  <h3>歷史版本</h3>
  <p class="muted">自動存檔時每隔幾分鐘記一個版本，最多保留 50 個。還原後可以再用 ↶ 復原。</p>
  <div id="versions" class="grid small"></div>
  <form method="dialog"><button>關閉</button></form>
</dialog>

<!-- 顏色數 -->
<dialog id="countDlg">
  <h3>用到的顏色</h3>
  <p id="countSum" class="muted"></p>
  <div id="colorList"></div>
  <div class="row"><span>相近色合併，減到</span><input id="reduceN" type="number" min="1" max="256" value="15" style="width:70px"><span>色</span><button id="reduceGo">減色</button></div>
  <form method="dialog" class="row"><button id="clearHi" type="button" hidden>取消標示</button><button>關閉</button></form>
</dialog>

<!-- PNG -->
<dialog id="pngDlg">
  <h3>匯出 PNG</h3>
  <p>放大倍率
    <select id="pngScale"><option>1</option><option>2</option><option>4</option><option selected>8</option><option>16</option></select>
  </p>
  <p><label><input type="checkbox" id="pngVisible" checked> 只輸出看得見的圖層</label></p>
  <form method="dialog" class="row"><button id="pngGo" value="go" class="primary">下載</button><button>取消</button></form>
</dialog>

<div id="toast" role="status"></div>
<!-- 匯入圖片轉像素 -->
<dialog id="impDlg" class="imp">
  <div class="imphead">
    <h3>圖片轉像素</h3>
    <label class="btn">選圖片…<input id="impFile" type="file" accept="image/*" hidden></label>
    <span class="muted small">也可以直接拖進來或貼上（Ctrl+V）</span>
    <span class="grow"></span>
    <button id="impCancel" class="ghost">取消</button>
    <button id="impOk" class="primary" disabled>匯入</button>
  </div>
  <div class="impbody">
    <div class="impviews">
      <div class="impbox">
        <div class="cap">原圖・<span class="muted">拖曳＝移動取樣框，滾輪／雙指＝縮放取樣框</span></div>
        <div id="impSrcWrap"><canvas id="impSrc"></canvas><p id="impHint" class="muted">先選一張圖片</p></div>
        <div class="row">
          <span class="muted">檢視</span><button id="impVz-">−</button><button id="impVz+">＋</button><button id="impVfit">全圖</button><button id="impVframe">對準框</button>
        </div>
      </div>
      <div class="impbox">
        <div class="cap">結果預覽 <span id="impInfo" class="muted"></span></div>
        <div id="impOutWrap"><canvas id="impOut"></canvas></div>
      </div>
    </div>
    <div class="impctl">
      <fieldset>
        <legend>取樣框（原圖像素）</legend>
        <div class="pad">
          <span></span><button data-mv="0,-1" title="上移 1px">↑</button><span></span>
          <button data-mv="-1,0" title="左移 1px">←</button><button id="impCenter" title="置中">◎</button><button data-mv="1,0" title="右移 1px">→</button>
          <span></span><button data-mv="0,1" title="下移 1px">↓</button><span></span>
        </div>
        <label>X <input id="impX" type="number" step="1"></label>
        <label>Y <input id="impY" type="number" step="1"></label>
        <label>每格 <input id="impCell" type="number" step="0.25" min="0.25"> 原圖像素</label>
        <div class="row"><button id="impC-" title="框變小（放大原圖）">框 −</button><button id="impC+" title="框變大（縮小原圖）">框 ＋</button><button id="impFit">框住全圖</button></div>
        <p class="muted small">方向鍵移動 1px，Shift+方向鍵 10px；+ / − 縮放取樣框。</p>
      </fieldset>
      <fieldset>
        <legend>輸出</legend>
        <div id="impSizeRow"><label>寬 <input id="impW" type="number" min="1" max="512"></label><label>高 <input id="impH" type="number" min="1" max="512"></label></div>
        <p id="impSizeNote" class="muted small"></p>
        <label>取樣 <select id="impMode"><option value="mode">主色（適合插畫、輪廓清楚）</option><option value="avg">平均（柔和）</option><option value="center">中心點（最銳利）</option></select></label>
        <label>色數 <select id="impColors"><option value="0">不減色</option><option>4</option><option>8</option><option>12</option><option>15</option><option>16</option><option>24</option><option>32</option><option value="pal">只用目前色票</option></select></label>
        <label>減色方式 <select id="impReduce"><option value="near">相近色合併（保留小面積的特殊色）</option><option value="cut">中位切割（依面積平均分配）</option></select></label>
        <label>透明門檻 <input id="impAlpha" type="range" min="1" max="255" value="128"></label>
        <label><input id="impBgOn" type="checkbox"> 把背景色變透明（取四角的顏色）</label>
        <label>放進 <select id="impTarget"><option value="layer">目前作品的新圖層</option><option value="new">新作品</option></select></label>
      </fieldset>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
<script src="import.js"></script>
</body>
</html>
