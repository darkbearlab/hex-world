<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>六角世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 測繪員的工作台。地圖是主角，下方/右側是控制列與編年史卷宗 */
:root{
  --bg:#eceeea; --surface:#f8f9f6; --fg:#1d2728; --muted:#5a6663; --line:#d0d6d2;
  --accent:#9a6a12; --accent-soft:#f1e6cf; --sea:#17303f; --good:#2f7a45; --warn:#a86a00; --bad:#b3261e;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1b; --surface:#1c2324; --fg:#e2e7e3; --muted:#93a19c; --line:#2d3839;
  --accent:#d8a443; --accent-soft:#3a2f1a; --sea:#0f222d; --good:#6cc287; --warn:#e3a33b; --bad:#f07065; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1b; --surface:#1c2324; --fg:#e2e7e3; --muted:#93a19c; --line:#2d3839;
  --accent:#d8a443; --accent-soft:#3a2f1a; --sea:#0f222d; --good:#6cc287; --warn:#e3a33b; --bad:#f07065; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:grid;gap:18px}
header h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.5rem,5vw,2.1rem);margin:0;letter-spacing:.04em;text-wrap:balance}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem;max-width:62ch}
.main{display:grid;gap:18px}
@media (min-width:960px){.main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:12px;min-width:0}
.mapbox{background:var(--sea);border-radius:6px;padding:8px;position:relative}
canvas{display:block;width:100%;touch-action:manipulation;cursor:crosshair}
.yearbadge{position:absolute;left:14px;top:12px;font-family:var(--f-display);color:#f3ead6;font-size:1.05rem;text-shadow:0 1px 3px #0008;pointer-events:none}
.yearbadge b{font-family:var(--f-data);font-size:1.4rem;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.timeline{display:flex;gap:10px;align-items:center}
.timeline input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.play{width:42px;height:34px;padding:0;font-size:1rem}
.seedin{font-family:var(--f-data);width:9.5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.factions{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem}
.factions span{display:inline-flex;align-items:center;gap:5px}
.factions i{width:10px;height:10px;border-radius:2px;display:inline-block}
.factions .dead{color:var(--muted);text-decoration:line-through}
.factions em{font-style:normal;font-family:var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.panel h2{font-family:var(--f-display);font-size:1.05rem;margin:0 0 6px;letter-spacing:.05em}
.lbl{font-size:.75rem;letter-spacing:.12em;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.88rem;margin:6px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.chron{list-style:none;margin:0;padding:0;max-height:min(62vh,640px);overflow-y:auto;font-size:.9rem}
.chron li{display:grid;grid-template-columns:4.2em 1fr;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chron li:hover{background:var(--accent-soft)}
.chron li.now{background:var(--accent-soft)}
.chron .y{font-family:var(--f-data);color:var(--accent);font-variant-numeric:tabular-nums;font-size:.82rem;padding-top:2px}
.chron .t{min-width:0}
.tag{display:inline-block;font-size:.7rem;padding:0 5px;border-radius:3px;margin-right:5px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.tag.war{color:#c0473a;border-color:#c0473a66}.tag.ruin{color:var(--muted)}.tag.hero{color:var(--accent);border-color:var(--accent)}.tag.bandit{color:#b4553a;border-color:#b4553a55}.tag.disaster{color:#5b84b8;border-color:#5b84b866}
.tilehist{list-style:none;padding:0;margin:6px 0 0;font-size:.84rem;color:var(--muted)}
.tilehist li{padding:2px 0}
.legend{font-size:.8rem;color:var(--muted);line-height:1.5}
.hint{color:var(--muted);font-size:.86rem;margin-bottom:6px}
.seg{flex-wrap:wrap}
.tw{overflow-x:auto}
table.econ{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
table.econ th,table.econ td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.econ thead th{font-weight:500;color:var(--muted);font-size:.78rem;letter-spacing:.06em}
table.econ tbody th{text-align:left;font-weight:500}
table.econ th:first-child{text-align:left}
table.econ i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
table.econ tr.dead{color:var(--muted)} table.econ tr.dead td{text-align:left}
td.ok{color:var(--good)} td.warn{color:var(--warn);font-weight:700} td.bad{color:var(--bad);font-weight:700}
[hidden]{display:none!important}
.tiers{margin:4px 0 10px;padding-left:1.1em;font-size:.88rem;display:grid;gap:3px}.tiers b{display:inline-block;min-width:3.6em;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6em,1fr));gap:6px;margin:6px 0 10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg)}.stat span{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em}.stat b{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:1rem}
.stat.bad b{color:var(--bad)}.acts{margin-bottom:8px}.acts small{color:var(--muted);font-family:var(--f-data);font-size:.72rem}
.lmsg{background:var(--accent-soft);border-radius:6px;padding:7px 10px;font-size:.9rem;margin-bottom:6px;min-height:2.4em}
.tag.you{color:var(--fg);border-color:var(--fg);font-weight:700}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:#0b1a22cc;color:#f3ead6;font-family:var(--f-display);font-size:1.1rem;border-radius:6px}
td.r{text-align:right}
@media (max-width:959px){.wrap,.main{grid-template-columns:minmax(0,1fr)}}
.wrap>*,.main>*,header.top>*{min-width:0}
.clock{min-width:0}
.col{grid-template-columns:minmax(0,1fr)}.col>*{min-width:0}
.tag.build{color:var(--muted);border-color:var(--muted)}
.tag.econ{color:var(--accent);border-color:var(--accent)}.tag.trade{color:var(--good);border-color:var(--good)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;min-width:14em}
.clock #clock{font-family:var(--f-display);font-size:1.25rem;font-weight:900}
.clock .sub{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:#0b1a22cc;color:#f3ead6;font-family:var(--f-display);font-size:1.1rem;border-radius:6px}
.hint{color:var(--muted);font-size:.86rem;margin-bottom:6px}
.legend{font-size:.8rem;color:var(--muted);line-height:1.5}
.seg{flex-wrap:wrap}
.tw{overflow-x:auto}
table.econ{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
table.econ th,table.econ td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.econ thead th{font-weight:500;color:var(--muted);font-size:.78rem;letter-spacing:.06em}
table.econ tbody th{text-align:left;font-weight:500}
table.econ th:first-child{text-align:left}
table.econ i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
table.econ tr.dead{color:var(--muted)} table.econ tr.dead td{text-align:left}
td.ok{color:var(--good)} td.warn{color:var(--warn);font-weight:700} td.bad{color:var(--bad);font-weight:700}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:6px;margin:6px 0 10px}
.npc{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.npc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.npc b{font-weight:700}.npc small{display:block;color:var(--muted);font-size:.74rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.hpbar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.hpbar i{display:block;height:100%;background:var(--good)}
.hpbar i.low{background:var(--bad)}
.alog{list-style:none;margin:6px 0 0;padding:0;font-size:.86rem}.alog li{padding:3px 0;border-bottom:1px solid var(--line)}.alog li span{color:var(--accent);font-family:var(--f-data);font-size:.78rem;margin-right:6px}
.tag.econ{color:var(--accent);border-color:var(--accent)}.tag.trade{color:var(--good);border-color:var(--good)}
.tag.build{color:var(--muted);border-color:var(--muted)}.tag.npc{color:var(--fg);border-color:var(--fg)}
td.r{text-align:right}
@media (max-width:959px){.wrap,.main{grid-template-columns:minmax(0,1fr)}}
.wrap>*,.main>*,header.top>*{min-width:0}
.clock{min-width:0}
.col{grid-template-columns:minmax(0,1fr)}.col>*{min-width:0}
.timeline .lbl{margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>六角世界</h1>
      <p>一個自己運轉的世界。開服前推演了四百年歷史，現在每 <span id="tickdesc">5 分鐘</span>推進一個時段；25 名旅人照自己的作息上線，打獵、伐木、採礦、跑商、清剿盜匪。</p>
    </div>
    <div class="clock"><div class="lbl">世界時間</div><div id="clock">連線中…</div><div class="sub" id="countdown"></div></div>
  </header>

  <div class="main">
    <div class="col">
      <div class="mapbox">
        <canvas id="map" aria-label="六角格世界地圖"></canvas>
        <div class="yearbadge" id="badge"></div>
        <div class="busy" id="busy">正在連上世界…</div>
      </div>
      <div class="timeline">
        <span class="lbl" style="white-space:nowrap">歷史回顧</span>
        <input type="range" id="year" min="0" max="400" value="400" aria-label="年份">
        <button class="btn" id="now">回到現在</button>
      </div>
      <div class="row" style="justify-content:space-between">
        <div class="seg" role="group" aria-label="圖層">
          <button data-layer="terrain" aria-pressed="false">地貌</button>
          <button data-layer="faction" aria-pressed="true">勢力</button>
          <button data-layer="bandit" aria-pressed="false">盜匪</button>
          <button data-layer="timber" aria-pressed="false">木材</button>
          <button data-layer="game" aria-pressed="false">獵物</button>
          <button data-layer="ore" aria-pressed="false">礦脈</button>
        </div>
        <div class="hint" id="meta" style="margin:0"></div>
      </div>
      <div class="legend" id="legend"></div>

      <div class="panel">
        <span class="lbl">旅人</span>
        <h2>25 名 NPC 的動態</h2>
        <div class="hint">和真人玩家走同一套行動介面：每個時段回 3 AP，只在自己的上線時段行動。下線時沒紮營，就可能在睡夢中被摸哨。點名字可以看他的日誌。</div>
        <div class="roster" id="roster"></div>
        <div id="actor"></div>
      </div>

      <div class="panel">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div><span class="lbl">國力與物資</span><h2 id="ehead">需求滿足率</h2></div>
          <div class="seg" role="group" aria-label="表格內容"><button data-tmode="ratio" aria-pressed="true">滿足率</button><button data-tmode="price" aria-pressed="false">市價</button></div>
        </div>
        <div id="factions"></div>
      </div>
      <div class="panel" id="tile"><span class="lbl">地塊</span><h2>點選地圖上的一格</h2><div class="hint">顯示地貌、歸屬、資源存量、站在這裡的旅人，以及這一格發生過的事。</div></div>
    </div>

    <div class="col">
      <div class="panel">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div><span class="lbl">編年史</span><h2 id="chronHead">世界的記憶</h2></div>
          <div class="seg" role="group" aria-label="篩選"><button data-cf="all" aria-pressed="true">全部</button><button data-cf="npc" aria-pressed="false">旅人</button><button data-cf="world" aria-pressed="false">世界</button></div>
        </div>
        <ul class="chron" id="chron"></ul>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./viewer.js"></script>
</body>
</html>
